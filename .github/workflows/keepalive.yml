name: Keep Supabase awake
# Supabase pauses free projects after about a week with no activity. This reads one row every other day so that doesn't happen.
# The URL and key come from public/config.js (the anon key is meant to be public).
on:
  schedule:
    - cron: "17 9 */2 * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read a row from the database
        run: |
          url=$(sed -n 's/.*SUPABASE_URL: *"\([^"]*\)".*/\1/p' public/config.js)
          key=$(sed -n 's/.*SUPABASE_KEY: *"\([^"]*\)".*/\1/p' public/config.js)
          if [ -z "$url" ] || [ -z "$key" ]; then echo "No Supabase settings in public/config.js"; exit 1; fi
          status=$(curl -s -o /dev/null -w "%{http_code}" "$url/rest/v1/members?select=name&limit=1" -H "apikey: $key" -H "Authorization: Bearer $key")
          echo "Supabase answered $status"
          if [ "$status" != "200" ]; then exit 1; fi
