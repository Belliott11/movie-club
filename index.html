<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Movie Club</title>
<meta name="theme-color" content="#14110e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  // palette and light/dark: the Theme menu's choice, else the device's setting
  const m = matchMedia("(prefers-color-scheme: dark)");
  const pref = k => { try { return JSON.parse(localStorage.getItem(k)) } catch { return null } };
  const apply = (theme = pref("theme-v1"), mode = pref("mode-v1")) => {
    const h = document.documentElement;
    if (theme && theme !== "cinema") h.dataset.theme = theme; else delete h.dataset.theme;
    h.classList.toggle("dark", mode === "dark" || (mode !== "light" && m.matches));
  };
  window.__applyTheme = apply; apply(); m.addEventListener("change", () => apply());
</script>
<script src="config.js"></script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
